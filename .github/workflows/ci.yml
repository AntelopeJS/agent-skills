name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      extra-commands: |
        pnpm check:plugin
        pnpm evals:check
        pnpm evals:baseline
