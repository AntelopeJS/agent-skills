name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [next]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      extra-commands: |
        pnpm check:plugin
        pnpm evals:check
        pnpm evals:baseline
      docs-files: |
        README.md
        plugin/packages/agent-skills/README.md
      renovate-sync: false
      test-job: true
      windows: false
    permissions:
      contents: read
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
