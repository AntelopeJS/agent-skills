name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      extra-commands: |
        pnpm check:plugin
        if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
          released=$(jq -r .merge_group.base_sha "$GITHUB_EVENT_PATH")
        else
          git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          released=origin/main
        fi
        pnpm check:plugin-version --released "$released"
        pnpm evals:check
        pnpm evals:baseline
      docs-files: |
        README.md
        plugin/packages/agent-skills/README.md
      renovate-sync: false
      test-job: true
      windows: false
    permissions:
      contents: read
    secrets:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
